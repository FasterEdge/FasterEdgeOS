# FasterEdgeOS 系统初始工具 —— DontCrack-Manager 根管理器配置。
# 单体的 DontCrack 一次只能管理一个进程; 本配置演示如何用根管理器
# 同时监管多个 DontCrack 实例(每个实例管理一个子进程)。
log_level: info
listen: 127.0.0.1:11884        # 聚合状态 HTTP(留空禁用); 对外监听必须配置 password
password: ""
shutdown_grace: 10s

services:
  # 演示服务: 常驻脚本, 每 30s 向 /var/lib/fasteredgeos/demo.stamp 写心跳。
  - name: demo
    path: /usr/bin/fasteredgeos-demo
    start_now: true
    port: 11883                 # 每实例端口必须唯一
    restart: always             # DontCrack 进程自身退出后的策略
    backoff: 3s
    backoff_max: 60s

  # 接入真实服务示例(启用时按实际调整): 依赖编排 + 健康探针。
  # - name: myapp
  #   path: /usr/bin/myapp
