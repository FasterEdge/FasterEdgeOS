# 活动 DNS 解析器的数量限制为 3 个。
#
#   https://linux.die.net/man/5/resolv.conf
#
# FasterEdgeOS 的策略是每家提供商使用一个 DNS 解析器。
# 第一个声明的 DNS 解析器是默认解析器。

# CloudFlare DNS
# http://blog.cloudflare.com/announcing-1111
nameserver 1.1.1.1
#nameserver 1.0.0.1

# Quad9 DNS
# http://quad9.net
nameserver 9.9.9.9

# Google Public DNS
# http://developers.google.com/speed/public-dns
nameserver 8.8.8.8
#nameserver 8.8.4.4