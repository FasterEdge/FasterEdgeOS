name: 'FasterEdgeOS With Integration Tests'
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'          # 打 v0.1.0 等标签时自动构建并产出镜像
  release:
    types: [published, released]
permissions:
  contents: write

jobs:
  fasteredgeos-with-tests:
    runs-on: 'ubuntu-24.04'    # glibc 2.44 要求 GCC 12.1+/binutils 2.39+，22.04 不满足
    steps:
    - uses: actions/checkout@v4    
    - name: 'Apply Workflow Patches'
      run: |
        cd .github
        bash ./github-ci.sh  
    - name: 'Setup Go toolchain'
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'      # fasteredgeos bundle(DontCrack-Manager)构建需要
    - name: 'Step 00 - Clean'
      run: |
        cd ./src
        bash ./00_clean.sh
    - name: 'Step 01 - Get Kernel'
      run: |
        cd ./src
        bash ./01_get_kernel.sh
    - name: 'Step 02 - Build Kernel'
      run: |
        cd ./src
        export NUM_JOBS=2   # CI runner 内存受限: 4 并行内核编译可能 OOM/卡死(9/7 实测)
        bash ./02_build_kernel.sh
    - name: 'Step 03 - Get GNU C Library'
      run: |
        cd ./src
        bash ./03_get_glibc.sh
    - name: 'Step 04 - Build GNU C Library'
      run: |
        cd ./src
        export NUM_JOBS=2   # 同 Step 02: CI 内存受限, 限制并行度
        bash ./04_build_glibc.sh
    - name: 'Step 05 - Prepare Sysroot'
      run: |
        cd ./src
        bash ./05_prepare_sysroot.sh
    - name: 'Step 06 - Get Busybox'
      run: |
        cd ./src
        bash ./06_get_busybox.sh
    - name: 'Step 07 - Build Busybox'
      run: |
        cd ./src
        export NUM_JOBS=2   # 同 Step 02: CI 内存受限, 限制并行度
        bash ./07_build_busybox.sh
    - name: 'Step 08 - Prepare Overlay Bundles'
      run: |
        cd ./src
        bash ./08_prepare_bundles.sh
    - name: 'Step 09 - Generate Root Filesystem'
      run: |
        cd ./src
        bash ./09_generate_rootfs.sh
    - name: 'Step 10 - Pack Root Filesystem'
      run: |
        cd ./src
        bash ./10_pack_rootfs.sh
    - name: 'Step 11 - Generate Overlay Area'
      run: |
        cd ./src
        bash ./11_generate_overlay.sh
    - name: 'Step 12 - Get Syslinux'
      run: |
        cd ./src
        bash ./12_get_syslinux.sh
    - name: 'Step 12b - Get Systemd-boot'
      run: |
        cd ./src
        bash ./12_get_systemd-boot.sh
    - name: 'Step 13 - Prepare ISO Image'
      run: |
        cd ./src
        bash ./13_prepare_iso.sh
    - name: 'Step 14 - Generate ISO Image'
      run: |
        cd ./src
        bash ./14_generate_iso.sh
    - name: 'Step 15 - Generate Docker Image'
      run: |
        cd ./src
        bash ./15_generate_image.sh
    - name: 'Step 16 - Final Cleanup'
      run: |
        cd ./src
        bash ./16_cleanup.sh
    - name: 'Test Docker'
      run: |
        cd .github
        bash ./test_docker.sh
    - name: 'Test QEMU'
      run: |
        cd .github
        bash ./test_qemu.sh
    # PR 的 ref_name 形如 15/merge,dependabot 分支名也含斜杠,
    # 而 upload-artifact 的工件名不允许出现 /,这里统一替换为连字符。
    - name: '计算工件名'
      shell: bash
      run: echo "ARTIFACT_NAME=fasteredgeos-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
    - name: 'Upload Build Artifacts'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: |
          src/fasteredgeos.iso
          src/fasteredgeos_image.tgz
          src/fasteredgeos*.log
        if-no-files-found: 'warn'
        retention-days: 14
    - name: '生成 MD5/SHA1 校验文件'
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
      run: |
        set -euo pipefail
        cd src
        files=()
        for f in fasteredgeos.iso fasteredgeos_image.tgz; do
          if [ -f "$f" ]; then
            files+=("$f")
          fi
        done
        if [ "${#files[@]}" -gt 0 ]; then
          md5sum "${files[@]}" > checksums-md5.txt
          sha1sum "${files[@]}" > checksums-sha1.txt
        else
          touch checksums-md5.txt checksums-sha1.txt
        fi
    - name: '上传到 GitHub Release'
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        files: |
          src/fasteredgeos.iso
          src/fasteredgeos_image.tgz
          src/checksums-md5.txt
          src/checksums-sha1.txt
        fail_on_unmatched_files: false
