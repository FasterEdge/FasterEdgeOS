name: 'Shell 语法与构建检查'
on:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    name: 'sh -n + shellcheck'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: 'sh -n 全部脚本'
      run: |
        set -e
        SCRIPTS=$(find .github src -name '*.sh' -type f | grep -v '/work/' | grep -v '/source/' || true)
        [ -n "$SCRIPTS" ] || { echo "no scripts found"; exit 0; }
        for f in $SCRIPTS; do sh -n "$f"; done
        echo "checked $(echo "$SCRIPTS" | wc -l) scripts (syntax OK)"
    - name: 'shellcheck(风格项不阻塞)'
      run: |
        if command -v shellcheck >/dev/null 2>&1; then
          SCRIPTS=$(find .github src -name '*.sh' -type f | grep -v '/work/' | grep -v '/source/' || true)
          shellcheck -s sh $SCRIPTS || true
          echo "shellcheck done (style-only warnings tolerated)"
        else
          echo "shellcheck not installed, skipped"
        fi
  any2utf8:
    name: 'any2utf8 go 编译'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache-dependency-path: src/minimal_overlay/bundles/any2utf8/src/go.sum
    - name: 'go build + vet + test'
      working-directory: src/minimal_overlay/bundles/any2utf8/src
      run: |
        set -e
        export GOFLAGS=-mod=mod
        CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/any2utf8 .
        test -x /tmp/any2utf8
        CGO_ENABLED=0 go vet ./...
        CGO_ENABLED=0 go test ./...
        echo "any2utf8 build+vet+test OK"
    - name: 'overlay bundle 构建+安装'
      run: |
        set -e
        cd src/minimal_overlay
        ./overlay_clean.sh >/dev/null
        ./overlay_build.sh any2utf8
        BIN=$(pwd)/../work/overlay_rootfs/usr/bin/any2utf8
        test -x "$BIN"
        "$BIN" -version

  any2pcd:
    name: 'any2pcd go 编译 + overlay bundle'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache-dependency-path: src/minimal_overlay/bundles/any2pcd/src/go.mod
    - name: 'go build + vet + test'
      working-directory: src/minimal_overlay/bundles/any2pcd/src
      run: |
        set -e
        export GOFLAGS=-mod=mod
        CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/any2pcd .
        test -x /tmp/any2pcd
        CGO_ENABLED=0 go vet ./...
        CGO_ENABLED=0 go test ./...
        echo "any2pcd build+vet+test OK"
    - name: 'overlay bundle 构建+安装'
      run: |
        set -e
        cd src/minimal_overlay
        ./overlay_clean.sh >/dev/null
        ./overlay_build.sh any2pcd
        BIN=$(pwd)/../work/overlay_rootfs/usr/bin/any2pcd
        test -x "$BIN"
        "$BIN" -version

  fasteredge:
    name: 'fasteredge go 编译 + overlay bundle'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    - name: 'overlay bundle 构建+安装'
      run: |
        set -e
        cd src/minimal_overlay
        ./overlay_clean.sh >/dev/null
        # fasteredge 依赖 fasteredgeos(根管理器), overlay_build 会依 bundle_deps 先行构建。
        ./overlay_build.sh fasteredge
        BIN=$(pwd)/../work/overlay_rootfs/usr/bin/fasteredge-demo
        test -x "$BIN"
        # examples/demo 为一次性程序: 完成框架骨架演示后约 100ms 优雅退出(exit 0)。
        timeout 60 "$BIN"
        echo "fasteredge demo 运行 OK(exit 0)"

  fasteredge2api:
    name: 'fasteredge2api go 编译 + overlay bundle'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    - name: 'overlay bundle 构建+安装'
      run: |
        set -e
        cd src/minimal_overlay
        ./overlay_clean.sh >/dev/null
        # fasteredge2api 依赖 fasteredgeos(根管理器), overlay_build 会依 bundle_deps 先行构建。
        ./overlay_build.sh fasteredge2api
        BIN=$(pwd)/../work/overlay_rootfs/usr/bin/fasteredge2api
        test -x "$BIN"
        "$BIN" version
        # 离线引导冒烟测试: token 子命令用临时 keyring 签发 admin 令牌(离线, exit 0)。
        KR=$(mktemp -d)/keyring.json
        TOK=$("$BIN" token --subject admin --ttl 24h --keyring "$KR")
        test -n "$TOK"
        echo "fasteredge2api version + token 引导冒烟测试 OK"
